name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, publish Pages, and mint the OIDC token
# actions/deploy-pages needs to prove the deployment came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Not cancel-in-progress: cancelling a half-finished
# Pages deploy can leave the live site on a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check every module
        run: |
          for f in js/*.js sw.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Verify rule data, arc geometry and offline shell
        # Blocks the deploy on a bad rule citation, a broken arc boundary, a
        # misclassified encounter, or a precache entry that no longer exists.
        run: node .github/scripts/verify.mjs

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on with "GitHub Actions" as the source on the first
          # run, so the repository needs no manual setup in Settings.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repository is the site — there is no build step. The
          # action excludes .git and .github, so the CI script and workflow
          # are not published.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
